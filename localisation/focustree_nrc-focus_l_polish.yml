l_polish: 
ALB_edykt_pierwszego_obywatela:0 "Edykt pierwszego obywatela"
ALB_edykt_pierwszego_obywatela_desc:0 "Jan I Kaczmarek zasiadł niedawno na fotelu prezydenta. Dokonał reform biegnących w konkrentych kierunkach i oznajmił konkretne drogi rozwoju. Jego pełna męki i znoju demokratyczna droga się kończy. Jan Kaczmarek demokratycznym głosem ludu zniósł istniejącą konstytucje roku 1904 i wprowadził EPO, które tworzy z państwa technokracje i zakazuje wyborów w kraju pozostawiając Jana we włady absolutnej - "L'état c'est moi"."
ALB_wizyta_w_wolframkach:0 "Wizyta w Wolframkach"
ALB_wizyta_w_wolframkach_desc:0 "Odwiedzmy dobrego przyjaciela wodza i przedyskutujmy sprawy."
ALB_stworzenie_nowego_sztabu_generalnego:0 "Stworzenie nowego sztabu generalnego"
ALB_stworzenie_nowego_sztabu_generalnego_desc:0 "Starzy generałowie mają zamknięte głowy i puste łby. Państwo potrzebuje prawdziwej reformy i pierwsze należy zacząć od reformy ludzi."
ALB_dzialogruntolamacz18cm:0 "Działo gruntołamacz 18 cm"
ALB_dzialogruntolamacz18cm_desc:0 "Armaty wiodą prym, a gruntołamacz ma precyzje 10 metrów. Będzie wiódł prym na polu walki."
ALB_powstanie_aa:0 "Powstanie AA"
ALB_powstanie_aa_desc:0 "Awangarda Antysocjalistyczna jest nową elitarną formacją sformalizowaną na potrzeby nowoczesnego państwa."
ALB_nowa_koncepcja_wojny:0 "Nowa koncepcja wojny"
ALB_nowa_koncepcja_wojny_desc:0 "Stare konflikty były ślamazarne, upadlające, długie. Nie miały chwały dzisiejszej wizji pola walki. Naszym celem jest węgiel, ropa i gaz!"
ALB_nowe_treningi_wojskowe:0 "Nowe treningi wojskowe"
ALB_nowe_treningi_wojskowe_desc:0 "Nowy sztab generalny dokonuje reform."
ALB_rewolucja_pola_bitwy:0 "Rewolucja pola bitwy"
ALB_rewolucja_pola_bitwy_desc:0 "Umieśćmy 18 cm działa na naszym nowym pojeździe"
ALB_okultystyczna_jednostka_specjalna:0 "Okultystyczna jednostka specjalna"
ALB_okultystyczna_jednostka_specjalna_desc:0 "Nadchodzi czas by poznać tajemnice naszej planety."
ALB_inframex:0 "Inframex"
ALB_inframex_desc:0 "Zbierz przywódców korporacji infastrukturalnych. Należy zebrać tych przywódców i obiecać im cele. Stwórzmy konglomerat ich korporacji, żeby służyli państwu w zamian za ulgi podatkowe."
ALB_unia_konstrukcyjna:0 "Unia konstrukcyjna"
ALB_unia_konstrukcyjna_desc:0 "Należy zebrać i dokonać stworzenia unii firm budowlanych."
ALB_konglomerat_wojskowy:0 "Konglomerat wojskowy"
ALB_konglomerat_wojskowy_desc:0 "Należy z naszych firm zbrojeniowych stworzyć konglomerat, który będzie na nasze usługi."
ALB_rozwiazanietraktatuprzyjazni:0 "Rozwiązanie traktatu przyjaźni"
ALB_rozwiazanietraktatuprzyjazni_desc:0 "lata temu sporządzony traktat przyjaźni, głosami 2:1 dziś przestał obowiązywać..."
ALB_stworzkkl:0 "Stwórz K.K.L."
ALB_stworzkkl_desc:0 "Mamy prosty cel. Stworzyć ewolucyjnie doskonałą istote ludzką, do tego musimy nagiąć troche nasze zasady i stworzyć korporacje lotniczą odpowiedzialną za produkcje samolotów,wtem ogłosiliśmy Kolosalną Korporację Lotniczą."
ALB_powstaniehierarchonarodow:0 "Powstanie Hierarchonarodów"
ALB_powstaniehierarchonarodow_desc:0 "Decyzje hierarchonarodów."
ALB_przygotowacwyprawy:0 "Przygotować wyprawy"
ALB_przygotowacwyprawy_desc:0 "Musimy się wyprawić na poszukiwanie arki przymierza, znaleźć święty graal, wyszukać wnętrze meteorytu Tunguskiego oraz zdobyć ciało istot pozaziemskich. Powinniśmy też rozważyć opcje przyzywające demonów oraz odwiedzić miejsca wampirzych nocy."
ALB_przygotowaniekoncepcjiuniwersalnegookretu:0 "Przygotowanie koncepcji uniwersalnego okrętu"
ALB_przygotowaniekoncepcjiuniwersalnegookretu_desc:0 "Okret powinenin posiadac uniwersalne działa."
ALB_morski_pakt:0 "Morski pakt"
ALB_morski_pakt_desc:0 "Wszystkie prywatne doki powinny płacić podatek, który nie jest pieniężny, lecz barterowy."
ALB_koncepcja_kolosa:0 "Koncepcja kolosa"
ALB_koncepcja_kolosa_desc:0 "Należy przygotować ciężki myśliwiec."
ALB_ekorewolucjapolnocy:0 "Ekorewolucja Północy"
ALB_ekorewolucjapolnocy_desc:0 "W Oslo rozpocznie się rewolucja, która wesprze naszą espansje."
ALB_ostatecznerozwiazanie:0 "Ostateczne rozwiązanie"
ALB_ostatecznerozwiazanie_desc:0 "powinniśmy przygotować ostateczne rozwiązanie dla socjalistów"
ALB_wizyta_w_szymonopolis:0 "Wizyta w Szymonopolis"
ALB_wizyta_w_szymonopolis_desc:0 "Udamy się do szymonopolis i przedyskutujemy szczegóły przyszłości świata. Wiemy, że ambicje demokratycznie wybranego dyktatora-elekta sięgają dużo dalej, niż lasy dalekiej Szymerii."
ALB_kongres_technokratyczny:0 "Kongres technokratyczny"
ALB_kongres_technokratyczny_desc:0 "Należy zwołać pierwszy kongres technokratyczny, który pozwoli nam odwrócić przekleństwo, które stało się ze światem."
ALB_dyplomatycznerozwiazaniemalarzawki:0 "Dyplomatyczne Rozwiązanie Malarzawki"
ALB_dyplomatycznerozwiazaniemalarzawki_desc:0 "Powinniśmy zrobić z Malarzawki naszego sojusznika."
ALB_wojskowerozwiazaniemalarzawki:0 "Wojskowe rozwiązanie Malarzawki"
ALB_wojskowerozwiazaniemalarzawki_desc:0 "Wytestujmy maszyne wojenną"
ALB_ostatnia_wizyta_w_da:0 "Ostatnia wizyta w DA"
ALB_ostatnia_wizyta_w_da_desc:0 "Czas polecieć ostatni raz do Ameryki i zagwarantować nam troche czasu"
ALB_ultimatum_dla_gractwa:0 "Ultimatum dla Gractwa"
